<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Low Vile Block | TORGOMIND</title>
	<meta name="description" content="Low Vile Block, an experimental online game by TORGOMIND where you violently break everything.">
	<style>
		@font-face {
			font-family: 'Trajan';
			src: url('../../assets/fonts/TrajanPro-Regular.ttf') format('truetype');
		}
		@font-face {
			font-family: 'BirchLeafFont';
			src: url('../../assets/fonts/BirchLeaf.ttf') format('truetype');
		}
		@font-face {
			font-family: 'Digital7';
			src: url('../../assets/fonts/digital7.ttf') format('truetype');
		}

		html {
			height: 100%;
		}
		body {
			background-image: url('img/bg.jpg');
			background-color: #080808;
			background-size: cover;
			background-position: center center;
			background-attachment: fixed;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			font-family: 'BirchLeafFont', monospace;
			margin: 0;
			padding: 20px;
			box-sizing: border-box;
		}

		.logo {
			max-width: 700px;
			width: 90%;
			height: auto;
			margin-bottom: 20px;
		}

		.leaderboard {
			max-width: 1200px;
			width: 100%;
			background-color: rgba(102, 0, 66, 0.1);
			border: 2px solid #000000;
			border-radius: 0;
			padding: 25px;
		}

		.leaderboard-content {
			display: flex;
			gap: 30px;
		}
		.column {
			flex: 1;
		}

		.slogan {
			color: #C757A3;
			font-size: 2.2em;
			margin: 0 0 25px 0;
			text-align: center;
			text-shadow: 1px 1px 3px #000;
			min-height: 1.5em;
		}

		h2 {
			color: #C75765;
			font-size: 1.5em;
			margin: 20px 0 10px 0;
			text-align: left;
			border-bottom: 1px solid #444;
			padding-bottom: 5px;
		}

		.player-list {
			font-family: 'Digital7';
			color: #C757A3;
			font-size: 2.8em;
			margin: 5px 0;
			padding-left: 75px;
			line-height: 1.6;
			text-align: left;
			text-shadow: 1px 1px 2px #000;
		}
		.player-list li::marker {
			color: #C757A3;
			font-weight: bold;

		}

		.progress-bar-container {
			width: 100%;
			height: 25px;
			background-color: #000000;
			border: 1px solid #444;
			margin-bottom: 5px;
		}
		.progress-bar {
			height: 100%;
			background-color: #C757A3;
			width: 0%;
			transition: width 0.5s ease-in-out;
		}
		.progress-bar.world-progress {
			background-color: #C757A3;
		}
		.progress-label {
			color: #C757A3;
			font-size: 0.9em;
			text-align: right;
		}


		.download-link {
			display: block;
			text-align: center;
			margin-top: 30px;
			color: #C757A3;
			font-size: 3.5em;
			text-shadow: 2px 2px 4px #000;
		}

		.download-link:hover {
			color: #000000;
			text-decoration: underline;
		}

		.file-info {
			font-size: 0.9em;
			color: #333;
			margin-top: 5px;
			text-align: center;
		}

		.file-info a {
			color: #444;
		}

		.trailer-link {
			display: block;
			text-align: center;
			margin-top: 20px;
			margin-bottom: -20px;
			color: #C757A3;
			font-size: 1.7em;
			text-shadow: 2px 2px 4px #000;
			cursor: pointer;
		}

		.trailer-link:hover {
			color: #000000;
			text-decoration: underline;
		}

		.video-container {
			position: relative;
			padding-bottom: 56.25%;
			height: 0;
			overflow: hidden;
			margin: 20px auto;
			max-width: 800px;
			display: none;
		}
		.video-container iframe {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
		}
	</style>
</head>
<body>

	<img src="img/title.png" alt="Game Logo" class="logo">

	<div class="leaderboard">
		<div class="leaderboard-content">
			<div class="column">
				<h2>Top Quote</h2>
				<h3 id="slogan_display" class="slogan">...</h3>

				<h2>Destruction</h2>
				<div class="progress-bar-container">
					<div id="corruption_bar" class="progress-bar"></div>
				</div>
				<p id="corruption_label" class="progress-label">Loading...</p>

				<h2>Time Progression</h2>
				<div class="progress-bar-container">
					<div id="world_progress_bar" class="progress-bar world-progress"></div>
				</div>
				<p id="world_progress_label" class="progress-label">Loading...</p>
			</div>

			<div class="column">
				<h2>Recent Guests</h2>
				<ol id="player_list_recent" class="player-list">
					<li>Loading...</li>
				</ol>
			</div>

			<div class="column">
				<h2>Permanent Residents</h2>
				<ol id="player_list_alltime" class="player-list">
					<li>Loading...</li>
				</ol>
			</div>
		</div>

		<a href="#" class="trailer-link" onclick="toggleTrailer()">Watch Trailer Video</a>

		<div id="video-container" class="video-container">
			<iframe src="https://www.youtube.com/embed/DSfNpiF-Ae0?si=efRav4Fs5PNr8c0S" frameborder="0" allowfullscreen></iframe>
		</div>

		<a href="https://torgomind.itch.io/low-vile-block" class="download-link">Download v0.15 (itch.io)</a>
		<a href="https://mega.nz/file/cNIAAQ6D#RTAvue-zDc1oakhbmdAYhzdPOCtKxTJyxBgdq5mKZis" class="download-link">Download v0.15 (mega.nz)</a>

	</div>

	<script>
		const word1=["","Hard","Behold","Dead","The","Awaken","Dripping","Glowing","Pale","Dancing","Again","Cute","Kill","Betray","Let","Sorry","Me","We","Soft","Tasty","No","Yield","Strange","King","Twin","Dark","Dead","Egg","Sharp","My","Your"];const word2=["","Snake","Ear","Ointment","Sirens","Barrel","Slugs","Girls","Bleeding","Fumes","Again","Rulers","Climbers","Guests","Torgo","Meat","They","Varnish","Liquid","Moisture","Drippings","In","The","Suns","Stars","Moons","Tears","Voices","Tongue","Mother","Puppet"];const word3=["","Bleed","Crash","Snarl","Fall","Kill","Burn","Again","Lurking","Forget","Forgotten","Tumble","Said","Drips","Yellow","Night","Sink","Rise","Circle","Flap","Sing","Die","Dissolve","Scream","Bloom","Aches","Dream","Open","Return","Rots","Grows"];
		function convertMantraCode(code){if(!code||code.length!==6){return"?????";}const index1=parseInt(code.substring(0,2),10);const index2=parseInt(code.substring(2,4),10);const index3=parseInt(code.substring(4,6),10);const w1=word1[index1]||"???";const w2=word2[index2]||"???";const w3=word3[index3]||"???";return`${w1} ${w2} ${w3}`;}

		const supabaseUrl = 'https://opvtdykuviyducakpamk.supabase.co';
		const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9wdnRkeWt1dml5ZHVjYWtwYW1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDc4ODY0MzksImV4cCI6MjA2MzQ2MjQzOX0.m1MshrKJ0MOWLheq_3Yx3Rqpz2NspsrjsYbbYWBUSx8';

		const statsUrl = `${supabaseUrl}/rest/v1/World_Stats?id=eq.1&select=*`;
		const playersRecentUrl = `${supabaseUrl}/rest/v1/Leaderboard_Recent?select=*&order=rank.asc&limit=10`;
		const playersAllTimeUrl = `${supabaseUrl}/rest/v1/Leaderboard_AllTime?select=*&order=rank.asc&limit=10`;

		async function fetchAllData() {
			const headers = { 'apikey': supabaseKey, 'Authorization': `Bearer ${supabaseKey}` };

			try {
				const [statsResponse, playersRecentResponse, playersAllTimeResponse] = await Promise.all([
					fetch(statsUrl, { headers }),
					fetch(playersRecentUrl, { headers }),
					fetch(playersAllTimeUrl, { headers })
				]);

				if (!statsResponse.ok) throw new Error(`Stats fetch failed: ${statsResponse.status}`);
				if (!playersRecentResponse.ok) throw new Error(`Recent players fetch failed: ${playersRecentResponse.status}`);
				if (!playersAllTimeResponse.ok) throw new Error(`All-time players fetch failed: ${playersAllTimeResponse.status}`);

				const statsData = await statsResponse.json();
				const playersRecentData = await playersRecentResponse.json();
				const playersAllTimeData = await playersAllTimeResponse.json();

				updateWorldStats(statsData);
				updatePlayerList(playersRecentData, 'player_list_recent');
				updatePlayerList(playersAllTimeData, 'player_list_alltime');

			} catch (error) {
				console.error("Failed to fetch leaderboard data:", error);
				document.getElementById('slogan_display').innerText = "DATA CORRUPTED";
				document.getElementById('player_list_recent').innerHTML = "<li>Error loading data.</li>";
				document.getElementById('player_list_alltime').innerHTML = "<li>Error loading data.</li>";
			}
		}

		function updateWorldStats(data) {
			if (data.length === 0) return;
			const stats = data[0];

			const mantraCode = stats.top_mantra || "000000";
			const sloganText = convertMantraCode(mantraCode);
			document.getElementById('slogan_display').innerText = sloganText;

			const corruptionLevel = stats.corruption_level || 0;
			const maxCorruption = 600;
			const corruptionPercent = (corruptionLevel / maxCorruption) * 100;
			document.getElementById('corruption_bar').style.width = `${corruptionPercent}%`;
			document.getElementById('corruption_label').innerText = `${Math.floor(corruptionPercent)}%`;

			const worldProgress = stats.world_timer_progress || 0;
			const worldProgressPercent = worldProgress * 100;
			document.getElementById('world_progress_bar').style.width = `${worldProgressPercent}%`;
			document.getElementById('world_progress_label').innerText = `${Math.floor(worldProgressPercent)}%`;
		}

		function updatePlayerList(players, elementId) {
			const playerListElement = document.getElementById(elementId);
			playerListElement.innerHTML = '';

			if (players.length === 0) {
				playerListElement.innerHTML = '<li>No players ranked yet.</li>';
				return;
			}

			players.forEach(player => {
				const listItem = document.createElement('li');
				listItem.innerText = `${player.player_name} ${player.score || 0}`;
				playerListElement.appendChild(listItem);
			});
		}

		fetchAllData();

		function toggleTrailer() {
			const videoContainer = document.getElementById('video-container');
			const trailerLink = document.querySelector('.trailer-link');

			if (videoContainer.style.display === 'none' || videoContainer.style.display === '') {
				videoContainer.style.display = 'block';
				trailerLink.innerText = 'Hide Trailer';
			} else {
				videoContainer.style.display = 'none';
				trailerLink.innerText = 'Watch the Trailer';
			}
		}
	</script>
</body>
</html>
