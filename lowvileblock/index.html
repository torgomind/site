<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>꒒ꊿꅐ꒦꒐꒒ꑀꃳ꒒ꊿꏳꈵ</title>
	<style>
		/* --- Custom Font Definition --- */
		@font-face {
			font-family: 'Trajan';
			src: url('../assets/TrajanPro-Regular.ttf') format('truetype');
		}
		@font-face {
			font-family: 'BirchLeafFont';
            src: url('../assets/BirchLeaf.ttf') format('truetype');
		}

		/* --- Global Styles & Background --- */
		html {
			height: 100%;
		}
		body {
			background-image: url('img/bg.jpg');
			background-color: #080808;
			background-size: cover;
			background-position: center center;
			background-attachment: fixed;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			font-family: 'BirchLeafFont', monospace;
			margin: 0;
			padding: 20px;
			box-sizing: border-box;
		}

		/* --- Logo Styling --- */
		.logo {
			max-width: 700px;
			width: 90%;
			height: auto;
			margin-bottom: 20px;
		}

		/* --- Panel Style --- */
		.leaderboard {
			max-width: 900px; /* Increased width for two columns */
			width: 100%;
			background-color: rgba(102, 0, 66, 0.1);
			border: 2px solid #000000;
			border-radius: 0;
			padding: 25px;
		}

		/* --- NEW: Two-Column Layout --- */
		.leaderboard-content {
			display: flex;
			gap: 40px; /* Space between columns */
		}
		.column {
			flex: 1; /* Each column takes up equal space */
		}

		/* --- Typography Styling --- */
		.slogan {
			color: #C757A3;
			font-size: 2.2em; /* Adjusted for space */
			margin: 0 0 25px 0;
			text-align: center;
			text-shadow: 1px 1px 3px #000;
			min-height: 1.5em;
		}

		h2 {
			color: #C75765;
			font-size: 1.5em;
			margin: 20px 0 10px 0;
			text-align: left;
			border-bottom: 1px solid #444;
			padding-bottom: 5px;
		}

		/* --- NEW: Player List Styling --- */
		.player-list {
			color: #C757A3;
			font-size: 2.3em;
			margin: 5px 0;
			padding-left: 75px; /* Indent the list */
			line-height: 1.6;
			text-align: left;
			text-shadow: 1px 1px 2px #000;
		}
		.player-list li::marker {
			color: #C757A3;
			font-weight: bold;

		}

		/* --- NEW: Progress Bar Styling --- */
		.progress-bar-container {
			width: 100%;
			height: 25px;
			background-color: #000000;
			border: 1px solid #444;
			margin-bottom: 5px;
		}
		.progress-bar {
			height: 100%;
			background-color: #C757A3; /* Corruption color */
			width: 0%; /* Will be set by JavaScript */
			transition: width 0.5s ease-in-out;
		}
		.progress-bar.world-progress {
			background-color: #C757A3; /* World progress color */
		}
		.progress-label {
			color: #C757A3;
			font-size: 0.9em;
			text-align: right;
		}


		.download-link {
			display: block;
			text-align: center;
			margin-top: 30px;
			color: #C757A3;
			font-size: 3.5em;
			text-shadow: 2px 2px 4px #000;
		}

		.download-link:hover {
			color: #000000;
			text-decoration: underline;
		}
	</style>
</head>
<body>

	<img src="img/title.png" alt="Game Logo" class="logo">

	<div class="leaderboard">
		<div class="leaderboard-content">
			<!-- Column 1: World Stats -->
			<div class="column">
				<h2>Top Quote</h2>
				<h3 id="slogan_display" class="slogan">...</h3>

				<h2>Destruction</h2>
				<div class="progress-bar-container">
					<div id="corruption_bar" class="progress-bar"></div>
				</div>
				<p id="corruption_label" class="progress-label">Loading...</p>

				<h2>Time Progression</h2>
				<div class="progress-bar-container">
					<div id="world_progress_bar" class="progress-bar world-progress"></div>
				</div>
				<p id="world_progress_label" class="progress-label">Loading...</p>
			</div>

			<!-- Column 2: Top Players -->
			<div class="column">
				<h2>Top Players</h2>
				<ol id="player_list" class="player-list">
					<li>Loading...</li>
				</ol>
			</div>
		</div>

		<!-- <a href="#" class="download-link" onclick="alert('Sorry, no download yet.')">Download</a>-->
		<a href="https://mega.nz/file/JYB3yBTB#4R_uTUuTvOCcLVyp-2k0eaasUCaErt-Mv-kIDEXOtAM" class="download-link">Download v0.13</a>

	</div>

	<!-- The JavaScript section with the new logic -->
	<script>
		// --- Word Arrays for Mantra Conversion (Unchanged) ---
		const word1=["","Hard","Behold","Dead","The","Awaken","Dripping","Glowing","Pale","Dancing","Again","Cute","Kill","Betray","Let","Sorry","Me","We","Soft","Tasty","No","Yield","Strange","King","Twin","Dark","Dead","Egg","Sharp","My","Your"];const word2=["","Snake","Ear","Ointment","Sirens","Barrel","Slugs","Girls","Bleeding","Fumes","Again","Rulers","Climbers","Guests","Torgo","Meat","They","Varnish","Liquid","Moisture","Drippings","In","The","Suns","Stars","Moons","Tears","Voices","Tongue","Mother","Puppet"];const word3=["","Bleed","Crash","Snarl","Fall","Kill","Burn","Again","Lurking","Forget","Forgotten","Tumble","Said","Drips","Yellow","Night","Sink","Rise","Circle","Flap","Sing","Die","Dissolve","Scream","Bloom","Aches","Dream","Open","Return","Rots","Grows"];
		function convertMantraCode(code){if(!code||code.length!==6){return"?????";}const index1=parseInt(code.substring(0,2),10);const index2=parseInt(code.substring(2,4),10);const index3=parseInt(code.substring(4,6),10);const w1=word1[index1]||"???";const w2=word2[index2]||"???";const w3=word3[index3]||"???";return`${w1} ${w2} ${w3}`;}

		// --- Supabase and NEW Fetching Logic ---
		const supabaseUrl = 'https://opvtdykuviyducakpamk.supabase.co';
		const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9wdnRkeWt1dml5ZHVjYWtwYW1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDc4ODY0MzksImV4cCI6MjA2MzQ2MjQzOX0.m1MshrKJ0MOWLheq_3Yx3Rqpz2NspsrjsYbbYWBUSx8';

		// Define the URLs for the two new tables
		const statsUrl = `${supabaseUrl}/rest/v1/World_Stats?id=eq.1&select=*`;
		const playersUrl = `${supabaseUrl}/rest/v1/Leaderboard_Players?select=*&order=rank.asc`;

		async function fetchAllData() {
			const headers = { 'apikey': supabaseKey, 'Authorization': `Bearer ${supabaseKey}` };

			try {
				// Use Promise.all to fetch both sets of data concurrently
				const [statsResponse, playersResponse] = await Promise.all([
					fetch(statsUrl, { headers }),
					fetch(playersUrl, { headers })
				]);

				if (!statsResponse.ok) throw new Error(`Stats fetch failed: ${statsResponse.status}`);
				if (!playersResponse.ok) throw new Error(`Players fetch failed: ${playersResponse.status}`);

				const statsData = await statsResponse.json();
				const playersData = await playersResponse.json();

				// --- Update the UI with the fetched data ---
				updateWorldStats(statsData);
				updatePlayerList(playersData);

			} catch (error) {
				console.error("Failed to fetch leaderboard data:", error);
				document.getElementById('slogan_display').innerText = "DATA CORRUPTED";
				document.getElementById('player_list').innerHTML = "<li>Error loading data.</li>";
			}
		}

		function updateWorldStats(data) {
			if (data.length === 0) return;
			const stats = data[0];

			// Update Slogan
			const mantraCode = stats.top_mantra || "000000";
			const sloganText = convertMantraCode(mantraCode);
			document.getElementById('slogan_display').innerText = sloganText;

			// Update Corruption Bar
			const corruptionLevel = stats.corruption_level || 0;
			const maxCorruption = 600; // 50 rooms * 12 points
			const corruptionPercent = (corruptionLevel / maxCorruption) * 100;
			document.getElementById('corruption_bar').style.width = `${corruptionPercent}%`;
			document.getElementById('corruption_label').innerText = `${Math.floor(corruptionPercent)}%`;

			// Update World Progress Bar
			const worldProgress = stats.world_timer_progress || 0;
			const worldProgressPercent = worldProgress * 100;
			document.getElementById('world_progress_bar').style.width = `${worldProgressPercent}%`;
			document.getElementById('world_progress_label').innerText = `${Math.floor(worldProgressPercent)}%`;
		}

		function updatePlayerList(players) {
			const playerListElement = document.getElementById('player_list');
			playerListElement.innerHTML = ''; // Clear the "Loading..." text

			if (players.length === 0) {
				playerListElement.innerHTML = '<li>No players ranked yet.</li>';
				return;
			}

			players.forEach(player => {
				const listItem = document.createElement('li');
				listItem.innerText = `${player.player_name} `;
				playerListElement.appendChild(listItem);
			});
		}

		// Initial fetch when the page loads
		fetchAllData();
	</script>
</body>
</html>
