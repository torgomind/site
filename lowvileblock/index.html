<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>LVB Leaderboard</title>
	<style>
    /* --- Custom Font Definition --- */
        @font-face {
            font-family: 'BirchLeafFont';
            src: url('../assets/BirchLeaf.ttf') format('truetype');
            font-family: 'Trajan';
            src: url('../assets/TrajanPro-Regular.ttf') format('truetype');

    }

		/* --- Global Styles & Background --- */
		html {
			height: 100%;
		}
		body {
			background-image: url('img/bg.jpg');
			background-color: #080808;
			background-size: cover;
			background-position: center center;
			background-attachment: fixed;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			font-family: 'Trajan', monospace;
			margin: 0;
			padding: 20px;
			box-sizing: border-box;
		}

		/* --- Logo Styling --- */
		.logo {
			max-width: 700px;
			width: 90%;
			height: auto;
			margin-bottom: 20px;
		}

		/* --- Panel Style --- */
		.leaderboard {
			max-width: 450px;
			width: 100%;
			background-color: #1A1D25;
			border: 2px solid #8DA75D;
			border-radius: 0;
			padding: 25px;
		}

		/* --- Typography Styling --- */
		.slogan {
			color: #8E8EB2;
			font-size: 3em;
			margin: 0 0 25px 0;
			text-align: center;
			text-shadow: 1px 1px 3px #000;
			min-height: 1.5em; /* Prevents layout shift while slogan loads */
		}

		h2 {
			color: #1A1D25;
			font-size: 2.0em;
			margin: 20px 0 10px 0;
			text-align: left;
		}

		p {
			color: #7B787B;
			font-size: 2.8em;
			margin: 5px 0;
			line-height: 1.3;
			text-align: left;
			text-shadow: 1px 1px 2px #000;
		}

		.download-link {
			display: block;
			text-align: center;
			margin-top: 30px;
			color: #7B787B;
			font-size: 2em;
			/*text-decoration: none;*/
			text-shadow: 2px 2px 4px #000;
		}

		.download-link:hover {
			color: #C32656;
			text-decoration: underline;
		}
	</style>
</head>
<body>

	<img src="img/title.png" alt="Game Logo" class="logo">

	<div class="leaderboard">
		<!-- The placeholder text will be replaced by the script -->
		<h2 id="slogan_display" class="slogan">...</h2>

		<h2>Leaders:</h2>
		<p id="rank1_player">#1: Loading...</p>
		<p id="rank2_player">#2: Loading...</p>
		<p id="rank3_player">#3: Loading...</p>

		<a href="#" class="download-link">Download</a>
	</div>

	<!-- The JavaScript section with the new logic -->
	<script>
		// --- Word Arrays for Mantra Conversion ---
		const word1 = [
			"", "Hard", "Behold", "Dead", "The", "Awaken", "Dripping", "Glowing", "Pale", "Dancing", "Again",
			"Cute", "Kill", "Betray", "Let", "Sorry", "Me", "We", "Soft", "Tasty", "No",
			"Yield", "Strange", "King", "Twin", "Dark", "Dead", "Egg", "Sharp", "My", "Your"
		];

		const word2 = [
			"", "Snake", "Ear", "Ointment", "Sirens", "Barrel", "Slugs", "Girls", "Bleeding", "Fumes", "Again",
			"Rulers", "Climbers", "Guests", "Torgo", "Meat", "They", "Varnish", "Liquid", "Moisture", "Drippings",
			"In", "The", "Suns", "Stars", "Moons", "Tears", "Voices", "Tongue", "Mother", "Puppet"
		];

		const word3 = [
			"", "Bleed", "Crash", "Snarl", "Fall", "Kill", "Burn", "Again", "Lurking", "Forget", "Forgotten",
			"Tumble", "Said", "Drips", "Yellow", "Night", "Sink", "Rise", "Circle", "Flap", "Sing",
			"Die", "Dissolve", "Scream", "Bloom", "Aches", "Dream", "Open", "Return", "Rots", "Grows"
		];

		/**
		 * Converts a 6-character code (e.g., "011530") into a three-word slogan.
		 * @param {string} code The 6-character string from the database.
		 * @returns {string} The resulting slogan.
		 */
		function convertMantraCode(code) {
			if (!code || code.length !== 6) {
				return "SLOGAN UNKNOWN"; // Error handling
			}

			// Split the code into three 2-digit parts and convert them to numbers
			const index1 = parseInt(code.substring(0, 2), 10);
			const index2 = parseInt(code.substring(2, 4), 10);
			const index3 = parseInt(code.substring(4, 6), 10);

			// Look up the words in the arrays. If an index is bad, default to "???"
			const w1 = word1[index1] || "???";
			const w2 = word2[index2] || "???";
			const w3 = word3[index3] || "???";

			return `${w1} ${w2} ${w3}`;
		}

		// --- Supabase and Fetching Logic ---
		const supabaseUrl = 'https://opvtdykuviyducakpamk.supabase.co';
		const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9wdnRkeWt1dml5ZHVjYWtwYW1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDc4ODY0MzksImV4cCI6MjA2MzQ2MjQzOX0.m1MshrKJ0MOWLheq_3Yx3Rqpz2NspsrjsYbbYWBUSx8';

		async function fetchLeaderboard() {
			// Assume your table has a 'top_mantra' column with the 6-character code
			const apiUrl = `${supabaseUrl}/rest/v1/leaderboard?id=eq.1&select=rank1_player,rank2_player,rank3_player,top_mantra`;

			try {
				const response = await fetch(apiUrl, {
					headers: { 'apikey': supabaseKey, 'Authorization': `Bearer ${supabaseKey}` }
				});
				if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

				const data = await response.json();

				if (data.length > 0) {
					const stats = data[0];

					// --- THE NEW LOGIC ---
					// 1. Get the code from the database
					const mantraCode = stats.top_mantra;

					// 2. Convert the code to a slogan using our function
					const sloganText = convertMantraCode(mantraCode);

					// 3. Update the slogan element on the page
					document.getElementById('slogan_display').innerText = sloganText;

					// Update the rest of the leaderboard
					document.getElementById('rank1_player').innerText = `#1: ${stats.rank1_player}`;
					document.getElementById('rank2_player').innerText = `#2: ${stats.rank2_player}`;
					document.getElementById('rank3_player').innerText = `#3: ${stats.rank3_player}`;
				}
			} catch (error) {
				console.error("Failed to fetch leaderboard:", error);
				document.getElementById('rank1_player').innerText = "Error loading data.";
				document.getElementById('slogan_display').innerText = "DATA CORRUPTED";
			}
		}

		fetchLeaderboard();
	</script>
</body>
</html>
