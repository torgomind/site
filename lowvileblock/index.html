<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LVB Leaderboard</title>
    <style>
        /* Just some basic styling */
        body { font-family: sans-serif; background-color: #2c2c2c; color: #e0e0e0; padding: 20px; }
        .leaderboard { border: 1px solid #555; padding: 15px; border-radius: 8px; max-width: 400px; }
        h1, h2 { color: #4d94ff; }
    </style>
</head>
<body>

    <div class="leaderboard">
        <h1>Low Vile Block</h1>

        <!-- The "Top Mantra" section has been removed. -->

        <h2>Leaders:</h2>
        <p id="rank1_player">#1: Loading...</p>
        <p id="rank2_player">#2: Loading...</p>
        <p id="rank3_player">#3: Loading...</p>
    </div>

    <script>
        // --- Step 1: Your Supabase Project Details ---
        const supabaseUrl = 'https://opvtdykuviyducakpamk.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9wdnRkeWt1dml5ZHVjYWtwYW1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDc4ODY0MzksImV4cCI6MjA2MzQ2MjQzOX0.m1MshrKJ0MOWLheq_3Yx3Rqpz2NspsrjsYbbYWBUSx8';

        // --- Step 2: Define the function to fetch and display the data ---
        async function fetchLeaderboard() {
            // This API call remains the same. It's fine to fetch the mantra and just not use it.
            const apiUrl = `${supabaseUrl}/rest/v1/leaderboard?id=eq.1&select=*`;

            try {
                const response = await fetch(apiUrl, {
                    headers: {
                        'apikey': supabaseKey,
                        'Authorization': `Bearer ${supabaseKey}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                if (data.length > 0) {
                    const leaderboardStats = data[0];

                    // --- Step 3: Update the HTML elements ---
                    // The line for 'top_mantra' has been removed.
                    document.getElementById('rank1_player').innerText = `#1: ${leaderboardStats.rank1_player}`;
                    document.getElementById('rank2_player').innerText = `#2: ${leaderboardStats.rank2_player}`;
                    document.getElementById('rank3_player').innerText = `#3: ${leaderboardStats.rank3_player}`;
                } else {
                    console.log("No leaderboard data found.");
                }

            } catch (error) {
                console.error("Failed to fetch leaderboard:", error);
                document.getElementById('rank1_player').innerText = "Error loading data.";
                document.getElementById('rank2_player').innerText = "";
                document.getElementById('rank3_player').innerText = "";
            }
        }

        // --- Step 4: Run the function when the page loads ---
        fetchLeaderboard();

    </script>
</body>
</html>
