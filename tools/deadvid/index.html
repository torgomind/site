<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Dead Video Search | TORGOMIND</title>
	<meta name="description" content="Generate search terms that find unwatched, zero-view YouTube videos. A free tool from TORGOMIND.">
	<link rel="stylesheet" href="../../assets/css/style.css">
	<link rel="stylesheet" href="../../assets/css/tools.css">
	<style>
		.deadvid {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 1.5rem;
		}

		.deadvid .tool-panel {
			width: 100%;
			max-width: 640px;
		}

		.output-card {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 1.2rem;
			padding: 2rem 1.5rem;
		}

		.term-display {
			font-family: var(--font-mono);
			font-size: clamp(1.8rem, 8vw, 3rem);
			color: var(--color-text-light);
			letter-spacing: 0.08em;
			text-align: center;
			min-height: 1.2em;
			word-break: break-all;
			line-height: 1.2;
		}

		.term-display.empty {
			color: var(--color-text-body);
		}

		.term-template {
			font-family: var(--font-mono);
			font-size: 0.8rem;
			color: var(--color-text-body);
			letter-spacing: 0.1em;
		}

		.divider {
			width: 100%;
			height: 1px;
			background-color: var(--color-border-card);
		}

		.btn-row {
			display: flex;
			gap: 0.75rem;
			flex-wrap: wrap;
			justify-content: center;
			width: 100%;
		}

		.btn-row button {
			text-transform: lowercase;
			white-space: nowrap;
		}

		.filters-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 1rem;
		}

		.filter-actions {
			display: flex;
			gap: 0.5rem;
		}

		.tool-page .text-btn {
			font-size: 0.9rem;
			padding: 0.1rem 0.5rem;
			border-width: 2px;
		}

		.section-label {
			margin-bottom: 0.5rem;
		}

		.chip-grid {
			display: flex;
			flex-wrap: wrap;
			gap: 6px;
			margin-bottom: 1rem;
		}

		.chip {
			font-family: var(--font-mono);
			font-size: 0.8rem;
			letter-spacing: 0.06em;
			padding: 5px 10px;
			border: 1px solid var(--color-border-card);
			background-color: var(--color-field-bg);
			color: var(--color-text-body);
			cursor: pointer;
			user-select: none;
		}

		.chip.active {
			border-color: var(--color-primary);
			color: var(--color-text-light);
			background-color: var(--color-primary-dark);
		}

		.chip:hover {
			border-color: var(--color-primary);
		}

		.deadvid-footer {
			font-size: 0.9rem;
			color: var(--color-text-body);
			letter-spacing: 0.06em;
			text-align: center;
		}

		@media (max-width: 420px) {
			.output-card {
				padding: 1.5rem 1rem;
			}

			#gen-btn {
				width: 100%;
			}

			.btn-row button {
				flex: 1 1 auto;
			}
		}
	</style>
</head>
<body class="tool-page">
	<div class="tool-shell">
		<nav class="tool-topbar">
			<a href="../index.html">« tools</a>
			<a href="../../index.html">torgomind</a>
		</nav>

		<h1 class="tool-title">dead video search</h1>
		<p class="tool-sub">zero-view youtube term generator</p>

		<div class="deadvid">
			<div class="tool-panel output-card">
				<div class="term-display empty" id="term">_ _ _ _ _ _</div>
				<div class="term-template" id="term-tmpl"></div>
				<div class="divider"></div>
				<div class="btn-row">
					<button id="gen-btn" class="primary" onclick="generate()">generate</button>
					<button id="copy-btn" onclick="copyTerm()">copy</button>
					<button id="lucky-btn" onclick="feelingLucky()">i’m feeling lucky</button>
				</div>
			</div>

			<div class="tool-panel">
				<div class="filters-header">
					<span class="tool-label">formats</span>
					<div class="filter-actions">
						<button class="text-btn" onclick="setAll(true)">all</button>
						<button class="text-btn" onclick="setAll(false)">none</button>
					</div>
				</div>

				<div class="tool-label section-label">numeric: prefix + 0000-9999</div>
				<div class="chip-grid" id="grid-num"></div>

				<div class="tool-label section-label">date: prefix + YYYYMMDD</div>
				<div class="chip-grid" id="grid-date"></div>
			</div>

			<div class="deadvid-footer">torgomind technology 2026</div>
		</div>
	</div>

<script>
	const FORMATS = [
		{ key:"MAQ0",    prefix:"MAQ0",    type:"4digit" },
		{ key:"MOV",     prefix:"MOV",     type:"4digit" },
		{ key:"MVI",     prefix:"MVI",     type:"4digit" },
		{ key:"DSC",     prefix:"DSC",     type:"4digit" },
		{ key:"CIMG",    prefix:"CIMG",    type:"4digit" },
		{ key:"M4V0",    prefix:"M4V0",    type:"4digit" },
		{ key:"VID0",    prefix:"VID0",    type:"4digit" },
		{ key:"DSCF",    prefix:"DSCF",    type:"4digit" },
		{ key:"IMG",     prefix:"IMG",     type:"4digit" },
		{ key:"DSCN",    prefix:"DSCN",    type:"4digit" },
		{ key:"MAH0",    prefix:"MAH0",    type:"4digit" },
		{ key:"IMGP",    prefix:"IMGP",    type:"4digit" },
		{ key:"100",     prefix:"100",     type:"4digit" },
		{ key:"P100",    prefix:"P100",    type:"4digit" },
		{ key:"PICT",    prefix:"PICT",    type:"4digit" },
		{ key:"Capture", prefix:"Capture", type:"date"   },
		{ key:"WIN",     prefix:"WIN",     type:"date"   },
		{ key:"WP",      prefix:"WP",      type:"date"   },
		{ key:"VID",     prefix:"VID",     type:"date"   },
		{ key:"CAPTURE", prefix:"CAPTURE", type:"date"   },
	];

	const active = new Set(FORMATS.map(f => f.key));
	let lastTerm = "";

	function rand4() {
		return String(Math.floor(Math.random() * 10000)).padStart(4, "0");
	}

	function randDate() {
		const start = new Date(2005, 3, 23).getTime();
		const end   = new Date(2026, 4, 16).getTime();
		const d     = new Date(start + Math.random() * (end - start));
		const y     = d.getFullYear();
		const m     = String(d.getMonth() + 1).padStart(2, "0");
		const day   = String(d.getDate()).padStart(2, "0");
		return `${y}${m}${day}`;
	}

	function generate() {
		const pool = FORMATS.filter(f => active.has(f.key));
		if (!pool.length) {
			document.getElementById("term").textContent = "no formats";
			return;
		}
		const fmt  = pool[Math.floor(Math.random() * pool.length)];
		const val  = fmt.type === "date" ? randDate() : rand4();
		const term = fmt.prefix + val;
		lastTerm   = term;
		const el   = document.getElementById("term");
		el.textContent = term;
		el.classList.remove("empty");
		document.getElementById("term-tmpl").textContent =
			fmt.prefix + (fmt.type === "date" ? "YYYYMMDD" : "XXXX");
	}

	function feelingLucky() {
		generate();
		if (lastTerm) {
			window.open("https://www.youtube.com/results?search_query=" + encodeURIComponent(lastTerm), "_blank");
		}
	}

	function copyTerm() {
		if (!lastTerm) return;
		navigator.clipboard.writeText(lastTerm).then(() => {
			const btn = document.getElementById("copy-btn");
			btn.textContent = "copied";
			btn.classList.add("active");
			setTimeout(() => {
				btn.textContent = "copy";
				btn.classList.remove("active");
			}, 1400);
		});
	}

	function setAll(state) {
		FORMATS.forEach(f => {
			if (state) active.add(f.key);
			else active.delete(f.key);
		});
		document.querySelectorAll(".chip").forEach(c => {
			c.classList.toggle("active", state);
		});
	}

	function buildGrids() {
		const numGrid  = document.getElementById("grid-num");
		const dateGrid = document.getElementById("grid-date");
		FORMATS.forEach(f => {
			const chip = document.createElement("div");
			chip.className = "chip active";
			chip.textContent = f.prefix + (f.type === "date" ? "…date" : "…####");
			chip.dataset.key = f.key;
			chip.onclick = () => {
				if (active.has(f.key)) {
					active.delete(f.key);
					chip.classList.remove("active");
				} else {
					active.add(f.key);
					chip.classList.add("active");
				}
			};
			(f.type === "date" ? dateGrid : numGrid).appendChild(chip);
		});
	}

	buildGrids();

	document.addEventListener("keydown", e => {
		if (e.code === "Space" || e.code === "Enter") {
			e.preventDefault();
			generate();
		}
		if ((e.ctrlKey || e.metaKey) && e.code === "KeyC" && lastTerm) copyTerm();
	});
</script>
</body>
</html>
