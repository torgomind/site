<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Spaces to Tabs | TORGOMIND</title>
	<meta name="description" content="Convert space indentation to tabs. A free tool from TORGOMIND.">
	<link rel="stylesheet" href="../../assets/css/style.css">
	<link rel="stylesheet" href="../../assets/css/tools.css">
	<style>
		.controls {
			display: flex;
			align-items: center;
			gap: 16px;
			flex-wrap: wrap;
			margin-bottom: 16px;
		}

		.controls label {
			display: flex;
			align-items: center;
			gap: 8px;
		}

		#width {
			width: 64px;
		}

		.grid {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 16px;
		}

		.pane {
			display: flex;
			flex-direction: column;
			gap: 6px;
		}

		.grid textarea {
			width: 100%;
			height: 60vh;
			resize: vertical;
			padding: 12px;
			font-size: 13px;
			line-height: 1.5;
			tab-size: 4;
			white-space: pre;
			overflow-wrap: normal;
			overflow-x: auto;
		}

		@media (max-width: 800px) {
			.grid {
				grid-template-columns: 1fr;
			}

			.grid textarea {
				height: 35vh;
			}
		}
	</style>
</head>
<body class="tool-page">
	<div class="tool-shell">
		<nav class="tool-topbar">
			<a href="../index.html">« tools</a>
			<a href="../../index.html">torgomind</a>
		</nav>

		<h1 class="tool-title">spaces to tabs</h1>
		<p class="tool-sub">paste on the left, copy from the right</p>

		<div class="controls">
			<label class="tool-label">Spaces per tab <input id="width" type="number" min="1" max="16" value="4"></label>
			<label class="tool-label"><input id="leading" type="checkbox" checked> Indentation only</label>
			<button id="copy" class="primary">Copy result</button>
			<button id="clear">Clear</button>
			<span id="status" class="tool-status"></span>
		</div>
		<div class="grid">
			<div class="pane">
				<span class="tool-label">Paste here</span>
				<textarea id="input" spellcheck="false" placeholder="Paste space-indented code"></textarea>
			</div>
			<div class="pane">
				<span class="tool-label">Result</span>
				<textarea id="output" spellcheck="false" readonly></textarea>
			</div>
		</div>
	</div>
<script>
	const input = document.getElementById("input");
	const output = document.getElementById("output");
	const width = document.getElementById("width");
	const leading = document.getElementById("leading");
	const status = document.getElementById("status");

	function convert() {
		const n = Math.max(1, parseInt(width.value, 10) || 4);
		const run = new RegExp(" {" + n + "}", "g");
		output.value = input.value.split("\n").map(line => {
			if (!leading.checked) return line.replace(run, "\t");
			const m = line.match(/^[ \t]+/);
			if (!m) return line;
			return m[0].replace(run, "\t") + line.slice(m[0].length);
		}).join("\n");
		output.style.tabSize = n;
		input.style.tabSize = n;
	}

	function flash(msg) {
		status.textContent = msg;
		setTimeout(() => { status.textContent = ""; }, 1500);
	}

	input.addEventListener("input", convert);
	width.addEventListener("input", convert);
	leading.addEventListener("change", convert);

	document.getElementById("copy").addEventListener("click", async () => {
		if (!output.value) return flash("Nothing to copy");
		try {
			await navigator.clipboard.writeText(output.value);
			flash("Copied");
		} catch {
			output.select();
			document.execCommand("copy");
			flash("Copied");
		}
	});

	document.getElementById("clear").addEventListener("click", () => {
		input.value = "";
		convert();
		input.focus();
	});

	convert();
</script>
</body>
</html>
