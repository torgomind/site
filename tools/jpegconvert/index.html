<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Bulk JPEG Convert | TORGOMIND</title>
	<meta name="description" content="Resize and recompress many images to JPEG, WebP or PNG at once, offline in your browser. A free tool from TORGOMIND.">
	<link rel="stylesheet" href="../../assets/css/style.css">
	<link rel="stylesheet" href="../../assets/css/tools.css">
	<style>
		#drop {
			padding: 34px 20px;
		}

		#drop .big {
			font-size: 1.4rem;
			letter-spacing: 0.08em;
			text-transform: uppercase;
		}

		#drop .small {
			font-size: 0.95rem;
			margin-top: 6px;
		}

		#controls {
			display: grid;
			grid-template-columns: 1fr 1fr auto;
			gap: 22px;
			align-items: end;
			margin-top: 18px;
		}

		.ctl label {
			display: flex;
			justify-content: space-between;
			align-items: baseline;
			margin-bottom: 8px;
		}

		.ctl label b {
			font-size: 1.2rem;
			font-weight: normal;
			letter-spacing: 0;
			color: var(--color-text-light);
		}

		.ctl input[type="range"] {
			width: 100%;
		}

		.stack {
			display: flex;
			flex-direction: column;
			gap: 10px;
		}

		#bar {
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 16px;
			margin-top: 20px;
			padding-bottom: 10px;
			border-bottom: 1px solid var(--color-border-card);
			font-size: 1rem;
			color: var(--color-text-body);
		}

		#bar .tally b {
			color: var(--color-text-light);
			font-weight: normal;
		}

		#bar .saving {
			color: #8fc46f;
		}

		#list {
			list-style: none;
			margin: 0;
			padding: 0;
		}

		#list li {
			display: grid;
			grid-template-columns: 48px 1fr 190px 84px;
			gap: 16px;
			align-items: center;
			padding: 10px 4px;
			border-bottom: 1px solid var(--color-border-card);
		}

		#list img {
			width: 48px;
			height: 48px;
			object-fit: cover;
			background-color: var(--color-field-bg);
			display: block;
		}

		.nm {
			color: var(--color-text-light);
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.dim {
			font-family: var(--font-mono);
			font-size: 11px;
			color: var(--color-text-body);
		}

		.sz {
			font-family: var(--font-mono);
			font-size: 12px;
			text-align: right;
		}

		.sz .to {
			color: var(--color-primary);
		}

		.sz .pct {
			color: #8fc46f;
		}

		.sz .pct.up {
			color: #d9705a;
		}

		.meter {
			height: 3px;
			background-color: var(--color-field-bg);
			margin-top: 6px;
			overflow: hidden;
		}

		.meter i {
			display: block;
			height: 100%;
			background-color: var(--color-primary);
			width: 0;
			transition: width 180ms ease;
		}

		.row-act {
			font-size: 1rem;
			text-align: right;
		}

		.row-act a {
			color: var(--color-text-body);
		}

		.row-act a:hover {
			color: var(--color-text-light);
		}

		#empty {
			color: var(--color-text-body);
			padding: 40px 4px;
			text-align: center;
		}
	</style>
</head>
<body class="tool-page">
<div class="tool-shell">
	<nav class="tool-topbar">
		<a href="../index.html">« tools</a>
		<a href="../../index.html">torgomind</a>
	</nav>

	<h1 class="tool-title">bulk jpeg convert</h1>
	<p class="tool-sub">local / offline</p>

	<div id="drop" class="tool-drop" tabindex="0" role="button">
		<div class="big">Drop images here</div>
		<div class="small">or click to choose &middot; ctrl+v to paste</div>
	</div>
	<input type="file" id="picker" accept="image/*" multiple hidden>

	<div id="controls" class="tool-panel">
		<div class="ctl">
			<label for="scale" class="tool-label">Resize <b><span id="scaleV">100</span>%</b></label>
			<input type="range" id="scale" min="1" max="100" value="100">
		</div>
		<div class="ctl">
			<label for="quality" class="tool-label">Quality <b><span id="qualV">80</span></b></label>
			<input type="range" id="quality" min="1" max="100" value="80">
		</div>
		<div class="stack">
			<select id="format">
				<option value="image/jpeg" selected>JPEG</option>
				<option value="image/webp">WebP</option>
				<option value="image/png">PNG</option>
			</select>
			<button id="save" class="primary" disabled>Save all</button>
		</div>
	</div>

	<div id="bar">
		<span class="tally" id="tally">No images loaded</span>
		<button id="clear" disabled>Clear</button>
	</div>

	<ul id="list"></ul>
	<div id="empty">Waiting for images.</div>
</div>

<script>
const crcTable = (() => {
	const t = new Uint32Array(256);
	for (let n = 0; n < 256; n++) {
		let c = n;
		for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
		t[n] = c >>> 0;
	}
	return t;
})();

function crc32(u8) {
	let c = 0xFFFFFFFF;
	for (let i = 0; i < u8.length; i++) c = crcTable[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
	return (c ^ 0xFFFFFFFF) >>> 0;
}

function dosStamp(d) {
	const time = ((d.getHours() & 31) << 11) | ((d.getMinutes() & 63) << 5) | ((d.getSeconds() / 2) & 31);
	const date = (((d.getFullYear() - 1980) & 127) << 9) | (((d.getMonth() + 1) & 15) << 5) | (d.getDate() & 31);
	return { time, date };
}

async function makeZip(items) {
	const enc = new TextEncoder();
	const stamp = dosStamp(new Date());
	const parts = [];
	const central = [];
	let offset = 0;

	for (const it of items) {
		const name = enc.encode(it.name);
		const data = new Uint8Array(await it.blob.arrayBuffer());
		const sum = crc32(data);

		const lh = new Uint8Array(30 + name.length);
		const lv = new DataView(lh.buffer);
		lv.setUint32(0, 0x04034b50, true);
		lv.setUint16(4, 20, true);
		lv.setUint16(6, 0x0800, true);
		lv.setUint16(8, 0, true);
		lv.setUint16(10, stamp.time, true);
		lv.setUint16(12, stamp.date, true);
		lv.setUint32(14, sum, true);
		lv.setUint32(18, data.length, true);
		lv.setUint32(22, data.length, true);
		lv.setUint16(26, name.length, true);
		lv.setUint16(28, 0, true);
		lh.set(name, 30);

		const cd = new Uint8Array(46 + name.length);
		const cv = new DataView(cd.buffer);
		cv.setUint32(0, 0x02014b50, true);
		cv.setUint16(4, 20, true);
		cv.setUint16(6, 20, true);
		cv.setUint16(8, 0x0800, true);
		cv.setUint16(10, 0, true);
		cv.setUint16(12, stamp.time, true);
		cv.setUint16(14, stamp.date, true);
		cv.setUint32(16, sum, true);
		cv.setUint32(20, data.length, true);
		cv.setUint32(24, data.length, true);
		cv.setUint16(28, name.length, true);
		cv.setUint32(42, offset, true);
		cd.set(name, 46);

		parts.push(lh, data);
		central.push(cd);
		offset += lh.length + data.length;
	}

	let cdSize = 0;
	for (const c of central) cdSize += c.length;

	const end = new Uint8Array(22);
	const ev = new DataView(end.buffer);
	ev.setUint32(0, 0x06054b50, true);
	ev.setUint16(8, central.length, true);
	ev.setUint16(10, central.length, true);
	ev.setUint32(12, cdSize, true);
	ev.setUint32(16, offset, true);

	return new Blob([...parts, ...central, end], { type: "application/zip" });
}

const EXT = { "image/jpeg": "jpg", "image/webp": "webp", "image/png": "png" };
const els = {
	drop: document.getElementById("drop"),
	picker: document.getElementById("picker"),
	scale: document.getElementById("scale"),
	scaleV: document.getElementById("scaleV"),
	quality: document.getElementById("quality"),
	qualV: document.getElementById("qualV"),
	format: document.getElementById("format"),
	save: document.getElementById("save"),
	clear: document.getElementById("clear"),
	list: document.getElementById("list"),
	tally: document.getElementById("tally"),
	empty: document.getElementById("empty")
};

let items = [];
let runToken = 0;
let timer = null;

function fmtBytes(n) {
	if (n < 1024) return n + " B";
	if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
	return (n / 1048576).toFixed(2) + " MB";
}

function baseName(n) {
	const i = n.lastIndexOf(".");
	return i > 0 ? n.slice(0, i) : n;
}

function addFiles(files) {
	const imgs = [...files].filter(f => f.type.startsWith("image/"));
	if (!imgs.length) return;
	for (const f of imgs) {
		items.push({
			file: f,
			url: URL.createObjectURL(f),
			w: 0,
			h: 0,
			outW: 0,
			outH: 0,
			blob: null,
			node: null,
			failed: false
		});
	}
	render();
	schedule(0);
}

function render() {
	els.list.innerHTML = "";
	els.empty.style.display = items.length ? "none" : "block";
	els.clear.disabled = !items.length;
	for (const it of items) {
		const li = document.createElement("li");
		li.innerHTML =
			'<img alt="">' +
			'<div><div class="nm"></div><div class="dim"></div><div class="meter"><i></i></div></div>' +
			'<div class="sz"></div>' +
			'<div class="row-act"></div>';
		li.querySelector("img").src = it.url;
		li.querySelector(".nm").textContent = it.file.name;
		li.querySelector(".dim").textContent = fmtBytes(it.file.size);
		els.list.appendChild(li);
		it.node = li;
	}
	paint();
}

function paint() {
	let inTotal = 0;
	let outTotal = 0;
	let done = 0;
	for (const it of items) {
		inTotal += it.file.size;
		if (!it.node) continue;
		const sz = it.node.querySelector(".sz");
		const dim = it.node.querySelector(".dim");
		const meter = it.node.querySelector(".meter i");
		const act = it.node.querySelector(".row-act");

		if (it.failed) {
			sz.innerHTML = '<span class="pct up">failed</span>';
			meter.style.width = "0";
			act.innerHTML = "";
			continue;
		}
		if (!it.blob) {
			sz.textContent = "working";
			continue;
		}
		outTotal += it.blob.size;
		done++;
		const ratio = it.blob.size / it.file.size;
		const pct = Math.round((1 - ratio) * 100);
		dim.textContent = it.w + " x " + it.h + "  >  " + it.outW + " x " + it.outH;
		sz.innerHTML =
			fmtBytes(it.file.size) + ' <span class="to">> ' + fmtBytes(it.blob.size) + "</span>" +
			'<br><span class="pct' + (pct < 0 ? " up" : "") + '">' + (pct < 0 ? "+" + -pct : "-" + pct) + "%</span>";
		meter.style.width = Math.max(2, Math.min(100, ratio * 100)) + "%";
		act.innerHTML = '<a href="#">download</a>';
		act.querySelector("a").onclick = e => {
			e.preventDefault();
			saveBlob(it.blob, baseName(it.file.name) + "." + EXT[els.format.value]);
		};
	}
	els.save.disabled = done === 0;
	if (!items.length) {
		els.tally.textContent = "No images loaded";
		return;
	}
	const saved = inTotal - outTotal;
	els.tally.innerHTML =
		"<b>" + items.length + "</b> images &middot; " +
		fmtBytes(inTotal) + " > <b>" + fmtBytes(outTotal) + "</b>" +
		(done === items.length && saved > 0
			? ' &middot; <span class="saving">' + fmtBytes(saved) + " saved</span>"
			: " &middot; " + done + "/" + items.length + " done");
}

async function encode(it, scale, quality, type) {
	const bmp = await createImageBitmap(it.file, { imageOrientation: "from-image" });
	it.w = bmp.width;
	it.h = bmp.height;
	it.outW = Math.max(1, Math.round(bmp.width * scale));
	it.outH = Math.max(1, Math.round(bmp.height * scale));
	const c = document.createElement("canvas");
	c.width = it.outW;
	c.height = it.outH;
	const ctx = c.getContext("2d");
	ctx.imageSmoothingEnabled = true;
	ctx.imageSmoothingQuality = "high";
	if (type === "image/jpeg") {
		ctx.fillStyle = "#ffffff";
		ctx.fillRect(0, 0, it.outW, it.outH);
	}
	ctx.drawImage(bmp, 0, 0, it.outW, it.outH);
	bmp.close();
	return new Promise((res, rej) => {
		c.toBlob(b => b ? res(b) : rej(new Error("encode failed")), type, quality);
	});
}

async function runAll() {
	const token = ++runToken;
	const scale = +els.scale.value / 100;
	const quality = +els.quality.value / 100;
	const type = els.format.value;
	for (const it of items) {
		it.blob = null;
		it.failed = false;
	}
	paint();
	for (const it of items) {
		if (token !== runToken) return;
		try {
			it.blob = await encode(it, scale, quality, type);
		} catch (e) {
			it.failed = true;
		}
		if (token !== runToken) return;
		paint();
	}
}

function schedule(delay) {
	clearTimeout(timer);
	timer = setTimeout(runAll, delay);
}

function saveBlob(blob, name) {
	const a = document.createElement("a");
	a.href = URL.createObjectURL(blob);
	a.download = name;
	a.click();
	setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

els.drop.onclick = () => els.picker.click();
els.drop.onkeydown = e => {
	if (e.key === "Enter" || e.key === " ") {
		e.preventDefault();
		els.picker.click();
	}
};
els.picker.onchange = e => {
	addFiles(e.target.files);
	e.target.value = "";
};

for (const ev of ["dragenter", "dragover"]) {
	els.drop.addEventListener(ev, e => {
		e.preventDefault();
		els.drop.classList.add("hot");
	});
}
for (const ev of ["dragleave", "drop"]) {
	els.drop.addEventListener(ev, e => {
		e.preventDefault();
		els.drop.classList.remove("hot");
	});
}
els.drop.addEventListener("drop", e => addFiles(e.dataTransfer.files));
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => e.preventDefault());
window.addEventListener("paste", e => {
	if (e.clipboardData && e.clipboardData.files.length) addFiles(e.clipboardData.files);
});

els.scale.oninput = () => {
	els.scaleV.textContent = els.scale.value;
	if (items.length) schedule(280);
};
els.quality.oninput = () => {
	els.qualV.textContent = els.quality.value;
	if (items.length) schedule(280);
};
els.format.onchange = () => {
	els.quality.disabled = els.format.value === "image/png";
	if (items.length) schedule(0);
};

els.clear.onclick = () => {
	runToken++;
	for (const it of items) URL.revokeObjectURL(it.url);
	items = [];
	render();
};

els.save.onclick = async () => {
	const ext = EXT[els.format.value];
	const ready = items.filter(i => i.blob);
	if (!ready.length) return;
	if (ready.length === 1) {
		saveBlob(ready[0].blob, baseName(ready[0].file.name) + "." + ext);
		return;
	}
	els.save.disabled = true;
	els.save.textContent = "Zipping";
	const used = new Map();
	const entries = ready.map(i => {
		let n = baseName(i.file.name);
		const seen = used.get(n) || 0;
		used.set(n, seen + 1);
		if (seen) n += "-" + seen;
		return { name: n + "." + ext, blob: i.blob };
	});
	const zip = await makeZip(entries);
	saveBlob(zip, "converted-" + entries.length + ".zip");
	els.save.textContent = "Save all";
	els.save.disabled = false;
};
</script>
</body>
</html>
